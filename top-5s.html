<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Top 5s — Sam's Portfolio</title>
<script>document.documentElement.classList.add("js");</script>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
  <span class="grain"></span>
</div>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html" title="Back to Sam's Portfolio">
      <span class="brand-mark">🏆</span>
      <span class="brand-text">Sam's <em>Top 5s</em></span>
    </a>
    <div class="header-actions">
      <a class="back-link" href="index.html">&larr; Portfolio</a>
      <button class="btn btn-ghost" id="shuffleBtn" title="Jump to a random category">Surprise me</button>
      <button class="btn btn-primary" id="editToggle" title="Add or change your lists">Edit lists</button>
    </div>
  </div>
</header>

<main>
  <section class="hero wrap">
    <h1 class="hero-title">My Top 5s<br><span class="grad">In Each Category</span></h1>
    <p class="hero-sub">Five slots per category.</p>
    <div class="hero-stats" id="heroStats"></div>
  </section>

  <nav class="catbar" id="catbar" aria-label="Categories">
    <div class="wrap catbar-inner">
      <div class="cat-scroll" id="catScroll"></div>
    </div>
  </nav>

  <div class="wrap">
    <div id="listRoot" class="lists"></div>
    <p class="empty-hint" id="emptyHint" hidden>
      Nothing here yet. Hit <strong>Edit lists</strong> up top to add your first category.
    </p>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <a href="index.html">Sam's Portfolio</a>
    <span class="dot">•</span>
    <span>Top 5s</span>
    <span class="dot">•</span>
    <button class="linkish" id="exportBtn">Export data</button>
    <span class="dot">•</span>
    <button class="linkish" id="importBtn">Import data</button>
    <span class="dot">•</span>
    <button class="linkish" id="resetBtn">Reset to defaults</button>
    <input type="file" id="importFile" accept="application/json" hidden>
  </div>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
  <figure class="lb-figure">
    <img id="lbImg" alt="">
    <figcaption id="lbCap"></figcaption>
  </figure>
</div>

<!-- Edit drawer -->
<aside class="drawer" id="drawer" hidden aria-label="Edit lists">
  <div class="drawer-head">
    <h2>Edit lists</h2>
    <button class="icon-btn" id="drawerClose" aria-label="Close editor">&times;</button>
  </div>
  <div class="drawer-body">
    <div class="field">
      <label for="catSelect">Category</label>
      <div class="row">
        <select id="catSelect"></select>
        <button class="btn btn-small" id="addCatBtn" title="New category">+ New</button>
      </div>
    </div>

    <div class="field">
      <label for="catName">Category name</label>
      <div class="row">
        <input type="text" id="catName" placeholder="e.g. TV Shows">
        <input type="text" id="catEmoji" class="emoji-in" placeholder="📺" maxlength="4" title="Emoji">
      </div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="drawer-actions">
      <button class="btn btn-danger-ghost" id="deleteCatBtn">Delete category</button>
      <button class="btn btn-primary" id="saveBtn">Save changes</button>
    </div>
    <p class="save-note" id="saveNote"></p>
  </div>
</aside>
<div class="drawer-scrim" id="scrim" hidden></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
